# =============================================================================
# LIMS IDIC · Preproducción (VPS) · stack completo detrás de Caddy (HTTPS)
# Colocar este archivo en la RAÍZ del monorepo (lims-idic/) junto al .env
# Arrancar:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Solo Caddy expone 80/443. Postgres/Redis/MinIO NO se publican a Internet.
# =============================================================================
services:
  caddy:
    image: caddy:2-alpine
    container_name: lims-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on: [web, api]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    container_name: lims-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
      # Frente f8: el pre-renderizado de Next también en hora de Chile.
      TZ: ${ZONA_HORARIA:-America/Santiago}
    expose: ["3000"]
    depends_on: [api]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    container_name: lims-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      # CORS restringido al dominio público (obligatorio en producción).
      CORS_ORIGINS: https://${DOMAIN}
      # URL impresa en el pie y en el QR de los documentos (pantalla /verificar/<código>).
      URL_VERIFICACION: ${URL_VERIFICACION:-https://${DOMAIN}/verificar}
      # Inteligencia de negocio (§4.7.5): dirección de Metabase que abre el menú
      # «Análisis e inteligencia de negocio». Vacía = la pantalla dice que no está configurado.
      URL_BI: ${URL_BI:-https://bi.${DOMAIN}}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Frente f8 · zona horaria del IDIC: «hoy», el corte de día, el año de la
      # numeración y las fechas impresas (common/fecha-chile.ts). La API fija
      # además la zona de su sesión de base de datos con ella.
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Santiago}
      TZ: ${ZONA_HORARIA:-America/Santiago}
      # Accesos de prueba por perfil en la pantalla de ingreso (docs/ACCESOS_DEMO.md).
      # SOLO preproducción: el compose on-premise no declara estas variables.
      ACCESOS_DEMO: ${ACCESOS_DEMO:-false}
      ACCESOS_DEMO_CLAVE: ${ACCESOS_DEMO_CLAVE:-}
      ACCESOS_DEMO_MOSTRAR_CLAVE: ${ACCESOS_DEMO_MOSTRAR_CLAVE:-true}
      # ETL IBIS · barrido automático de la carpeta cada 24h (proceso interno de la API).
      IBIS_CRON_HABILITADO: ${IBIS_CRON_HABILITADO:-false}
      IBIS_CRON_HORA: ${IBIS_CRON_HORA:-02:00}
      # Instrumentos (§4.4.6) · lectura automática: una subcarpeta por perfil de instrumento.
      INSTRUMENTOS_DIR: /data/instrumentos
      INSTRUMENTOS_INTERVALO_S: ${INSTRUMENTOS_INTERVALO_S:-60}
    volumes:
      - ${INSTRUMENTOS_HOST_DIR:-./instrumentos}:/data/instrumentos
      - ${IBIS_DIR:-./ibis}/entrada:/data/ibis/entrada
      - ${IBIS_DIR:-./ibis}/procesados:/data/ibis/procesados
      - ${IBIS_DIR:-./ibis}/errores:/data/ibis/errores
    expose: ["3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    container_name: lims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${ZONA_HORARIA:-America/Santiago}
      PGTZ: ${ZONA_HORARIA:-America/Santiago}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Sin "ports": solo accesible dentro de la red Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lims-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lims-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # consola/API solo internas; exponer vía Caddy si se necesita

  metabase:
    # Versión FIJA (línea LTS 0.64): «latest» es una etiqueta móvil y un
    # «docker compose pull» podía cambiar de versión sin aviso. Metabase no admite
    # volver a una versión anterior sobre su base: para subir de versión, cambie
    # METABASE_IMAGE en el .env tras respaldar (docs/RESPALDOS_Y_BI.md §2.1).
    image: ${METABASE_IMAGE:-metabase/metabase:v0.64.5.1}
    container_name: lims-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      # Base propia: en la del LIMS chocaba con la tabla `audit_log` y Metabase
      # no llegaba a arrancar. La crea provision.sh.
      MB_DB_DBNAME: ${METABASE_DB:-lims_metabase}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      # Dirección pública (bi.<dominio>, Caddyfile): enlaces y correos de Metabase.
      MB_SITE_URL: https://bi.${DOMAIN}
      MB_SITE_LOCALE: es
      # Sin telemetría hacia el fabricante ni comprobación de versiones.
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: ${ZONA_HORARIA:-America/Santiago}
      TZ: ${ZONA_HORARIA:-America/Santiago}
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    depends_on:
      postgres: { condition: service_healthy }

  # Respaldo programado de la base del LIMS (contrato §4.8.4). pg_dump diario a
  # la hora de «Parámetros del sistema › Respaldos de la base de datos»,
  # verificado, con retención diaria/semanal y registro de cada ejecución en
  # `respaldo_registro` (pantalla Administración › Respaldos).
  # Guía y restauración: docs/RESPALDOS_Y_BI.md. Respaldo inmediato desde la consola:
  #   docker compose -f docker-compose.prod.yml run --rm respaldo --ahora
  respaldo:
    # Misma imagen que la base: pg_dump/pg_restore de la misma versión mayor.
    image: postgres:16-alpine
    container_name: lims-respaldo
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/respaldo-programado.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      METABASE_DB: ${METABASE_DB:-lims_metabase}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Santiago}
      TZ: ${ZONA_HORARIA:-America/Santiago}
      # Valores de partida si la base aún no tiene los parámetros «respaldos.*».
      RESPALDO_HORA: ${RESPALDO_HORA:-2}
      RESPALDO_RETENCION_DIARIOS: ${RESPALDO_RETENCION_DIARIOS:-14}
      RESPALDO_RETENCION_SEMANALES: ${RESPALDO_RETENCION_SEMANALES:-8}
      RESPALDO_SERVIDOR: ${RESPALDO_SERVIDOR:-preproduccion}
    volumes:
      - ./scripts/backup:/scripts:ro
      # Carpeta del HOST con los respaldos (700, solo root). Llévela también fuera
      # del servidor: un respaldo en el mismo disco no protege de su pérdida.
      - ${RESPALDO_HOST_DIR:-./respaldos}:/respaldos
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
